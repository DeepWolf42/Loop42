name: Loop42 CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: loop42-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run repository policy tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Verify opt-in completion gates on exact checked-out revision
        shell: bash
        run: |
          python -m tools.checks.completion_gates tests/frozen_scenarios/loop42_completion_gates_v1.json --repo . --expected-revision "$(git rev-parse HEAD)" --run

  repository-policy:
    if: ${{ always() }}
    needs: repository-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform test job to pass
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.repository-tests.result }}
        run: test "$MATRIX_RESULT" = success
